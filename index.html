<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ECEDEF">
    <meta name="description" content="A lightweight calculator for basic arithmetic, with keyboard support.">
    <title>JavaScript Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container" aria-label="Calculator">
        <div class="display">
            <input
                id="displayResult"
                type="text"
                placeholder="0"
                aria-label="Calculator display"
                aria-live="polite"
                readonly
            >
        </div>
        <div class="buttons">
            <div class="row">
                <input type="button" class="utility" value="C" data-action="clear" aria-label="Clear">
                <input type="button" class="utility" value="⌫" data-action="backspace" aria-label="Backspace">
                <input type="button" value="(" data-value="(" aria-label="Open parenthesis">
                <input type="button" value=")" data-value=")" aria-label="Close parenthesis">
            </div>
            <div class="row">
                <input type="button" value="7" data-value="7">
                <input type="button" value="8" data-value="8">
                <input type="button" value="9" data-value="9">
                <input type="button" value="+" data-value="+" aria-label="Add">
            </div>
            <div class="row">
                <input type="button" value="4" data-value="4">
                <input type="button" value="5" data-value="5">
                <input type="button" value="6" data-value="6">
                <input type="button" value="−" data-value="-" aria-label="Subtract">
            </div>
            <div class="row">
                <input type="button" value="1" data-value="1">
                <input type="button" value="2" data-value="2">
                <input type="button" value="3" data-value="3">
                <input type="button" value="×" data-value="*" aria-label="Multiply">
            </div>
            <div class="row">
                <input type="button" value="0" data-value="0">
                <input type="button" value="." data-value="." aria-label="Decimal point">
                <input type="button" value="÷" data-value="/" aria-label="Divide">
                <input type="button" class="red" value="=" data-action="equals" aria-label="Equals">
            </div>
        </div>
        <p class="keyboard-hint">Keyboard: numbers and operators · Enter to calculate · Esc to clear</p>
    </main>
    <script src="main.js" defer></script>
</body>
</html>
